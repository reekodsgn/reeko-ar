<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Reeko WebAR</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,system-ui,sans-serif}video{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:0!important}a-scene{position:fixed!important;inset:0!important;z-index:1!important;background:transparent!important}#ui{position:fixed;inset:0;z-index:20;pointer-events:none}#hint{position:absolute;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:rgba(20,20,20,.72);color:white;padding:10px 14px;border-radius:999px;font-size:13px;white-space:nowrap}#cta{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#111;padding:14px 18px;border-radius:999px;text-decoration:none;font-weight:800;display:none;pointer-events:auto;white-space:nowrap}</style></head><body><div id="ui"><div id="hint">Inquadra il visual</div><a id="cta" href="https://www.reeko.co/" target="_blank" rel="noopener">Scopri Reeko ↗</a></div><a-scene mindar-image="imageTargetSrc:targets.mind;autoStart:true;uiScanning:no" color-space="sRGB" renderer="colorManagement:true;alpha:true" background="transparent:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"><a-assets><canvas id="gif0"></canvas><img id="asset1" src="layer-02.png" crossorigin="anonymous"></a-assets><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex:0"><a-plane id="layer0" material="src:#gif0;transparent:true;shader:flat;opacity:1;side:double" position="0.0000 0.0000 0.0200" rotation="0 0 0" width="0.7200" height="1.2798" ></a-plane>
<a-image id="layer1" src="#asset1" position="-0.8054 0.5214 0.0220" rotation="0 0 0" width="0.5500" height="0.3959" opacity="1" transparent="true" material="shader:flat;transparent:true;side:double" ></a-image></a-entity></a-scene><script type="module">import {parseGIF,decompressFrames} from 'https://esm.sh/gifuct-js@2.1.2';const target=document.querySelector('#target'),cta=document.querySelector('#cta'),hint=document.querySelector('#hint');target.addEventListener('targetFound',()=>{cta.style.display='block';hint.textContent='Esperienza attiva'});target.addEventListener('targetLost',()=>{cta.style.display='none';hint.textContent='Inquadra il visual'});async function startGif(i,url){const canvas=document.querySelector('#gif'+i),ctx=canvas.getContext('2d'),buf=await fetch(url).then(r=>r.arrayBuffer()),gif=parseGIF(buf),frames=decompressFrames(gif,true);canvas.width=gif.lsd.width;canvas.height=gif.lsd.height;let fi=0,prev=null;function step(){if(prev&&prev.disposalType===2){const d=prev.dims;ctx.clearRect(d.left,d.top,d.width,d.height)}const f=frames[fi],img=new ImageData(f.patch,f.dims.width,f.dims.height);ctx.putImageData(img,f.dims.left,f.dims.top);const plane=document.querySelector('#layer'+i),mesh=plane?.getObject3D('mesh'),map=mesh?.material?.map;if(map)map.needsUpdate=true;prev=f;fi=(fi+1)%frames.length;setTimeout(step,Math.max(20,f.delay||100))}step()}startGif(0,'layer-01.gif');
</script><script>window.addEventListener('load',()=>{const s=document.querySelector('a-scene');s.addEventListener('loaded',()=>{const r=s.renderer;if(r){r.setClearColor(0x000000,0);r.setClearAlpha(0)}})});</script></body></html>
