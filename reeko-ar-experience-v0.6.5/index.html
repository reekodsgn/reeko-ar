<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Reeko WebAR</title><script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Inter,system-ui,-apple-system,sans-serif}video{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;z-index:0!important}a-scene{position:fixed!important;inset:0!important;z-index:1!important;background:transparent!important}#ui{position:fixed;inset:0;z-index:20;pointer-events:none}#brandLogo{position:absolute;top:18px;left:18px;width:50px;max-height:48px;object-fit:contain;z-index:5}#intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#000000;transition:opacity .32s ease,visibility .32s ease;overflow:hidden}#intro.hidden{opacity:0;visibility:hidden}#introBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#introContent{position:absolute;inset:0;z-index:2;width:100%;height:100%}#introTarget{position:absolute;max-height:34vh;object-fit:contain;border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.14)}#activate{position:absolute;height:48px;min-height:48px;box-sizing:border-box;appearance:none;border:0;display:inline-flex;align-items:center;gap:8px;background:#171717;color:#ffffff;padding:15px 20px;border-radius:999px;font:800 16px/1 Inter,system-ui,sans-serif;box-shadow:0 8px 26px rgba(0,0,0,.12)}#activate img,#cta img{width:18px;height:18px;object-fit:contain}#scanGuide{position:absolute;top:50%;left:50%;transform:translateY(-50%) translateX(-50%);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;width:260px;max-width:76%}#scanGuide img{width:104px;height:auto;max-width:70%;max-height:190px;object-fit:contain;border-radius:10px;box-shadow:0 8px 26px rgba(0,0,0,.2)}#scanText{background:rgba(18,18,18,.72);color:white;padding:9px 13px;border-radius:999px;font-size:13px;font-weight:800}#scanSub{font-size:11px;color:white;text-shadow:0 1px 4px rgba(0,0,0,.5)}#cta{position:absolute;height:48px;min-height:48px;box-sizing:border-box;bottom:22px;left:50%;transform:translateX(-50%);background:#e392fe;color:#111111;padding:14px 18px;border-radius:999px;text-decoration:none;font-weight:800;display:none;pointer-events:auto;white-space:nowrap;align-items:center;gap:8px}</style></head><body><div id="intro"><div id="introContent"><img id="introTarget" src="target.png" style="width:105px;top:50%;left:50%;transform:translateY(-50%) translateX(-50%);" alt=""><button id="activate" type="button" style="bottom:28px;left:50%;transform:translateX(-50%);"><span>Mostra visual</span></button></div></div><div id="ui"><img id="brandLogo" src="brand-logo.svg" alt=""><div id="scanGuide"><img src="target.png" alt=""><div id="scanText">Inquadra questo visual</div><div id="scanSub">Tieni il visual dentro l&#39;inquadratura</div></div><a id="cta" href="https://www.reeko.co/" target="_blank" rel="noopener"><span>Scopri Reeko ↗</span></a></div><a-scene mindar-image="imageTargetSrc:targets.mind;autoStart:false;uiScanning:no" color-space="sRGB" renderer="colorManagement:true;alpha:true" background="transparent:true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"><a-assets><canvas id="gif0"></canvas></a-assets><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex:0"><a-plane id="layer0" material="src:#gif0;transparent:true;shader:flat;opacity:1;side:double" position="0.0000 0.0000 0.0200" rotation="0 0 0" width="0.8080" height="1.4361" ></a-plane></a-entity></a-scene><script type="module">import {parseGIF,decompressFrames} from 'https://esm.sh/gifuct-js@2.1.2';const scene=document.querySelector('a-scene'),target=document.querySelector('#target'),cta=document.querySelector('#cta'),scan=document.querySelector('#scanGuide'),intro=document.querySelector('#intro'),activate=document.querySelector('#activate');let started=false;async function startAR(){if(started)return;started=true;try{await scene.systems['mindar-image-system'].start();document.body.style.background='transparent';scan.style.display='flex';intro.classList.add('hidden');setTimeout(()=>intro.style.display='none',350)}catch(err){started=false;console.error(err);activate.querySelector('span').textContent='Riprova'}}scene.addEventListener('loaded',()=>{});activate?.addEventListener('click',startAR);target.addEventListener('targetFound',()=>{scan.style.display='none';cta.style.display='inline-flex'});target.addEventListener('targetLost',()=>{cta.style.display='none';scan.style.display='flex'});async function startGif(i,url){const canvas=document.querySelector('#gif'+i),ctx=canvas.getContext('2d'),buf=await fetch(url).then(r=>r.arrayBuffer()),gif=parseGIF(buf),frames=decompressFrames(gif,true);canvas.width=gif.lsd.width;canvas.height=gif.lsd.height;let fi=0,prev=null;function step(){if(prev&&prev.disposalType===2){const d=prev.dims;ctx.clearRect(d.left,d.top,d.width,d.height)}const f=frames[fi],img=new ImageData(f.patch,f.dims.width,f.dims.height);ctx.putImageData(img,f.dims.left,f.dims.top);const plane=document.querySelector('#layer'+i),mesh=plane?.getObject3D('mesh'),map=mesh?.material?.map;if(map)map.needsUpdate=true;prev=f;fi=(fi+1)%frames.length;setTimeout(step,Math.max(20,f.delay||100))}step()}startGif(0,'layer-01.gif');</script><script>window.addEventListener('load',()=>{const s=document.querySelector('a-scene');s.addEventListener('loaded',()=>{const r=s.renderer;if(r){r.setClearColor(0x000000,0);r.setClearAlpha(0)}})});</script></body></html>
