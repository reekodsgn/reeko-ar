<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Reeko AR Demo</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}
#hint{
  position:fixed;z-index:20;top:18px;left:50%;transform:translateX(-50%);
  width:min(90vw,520px);padding:11px 14px;border-radius:999px;
  background:rgba(15,15,15,.72);backdrop-filter:blur(10px);
  color:#fff;text-align:center;font-size:13px;line-height:1.3;pointer-events:none
}
#cta{
  display:none;position:fixed;z-index:30;right:18px;bottom:26px;
  background:#fff;color:#111;text-decoration:none;border-radius:999px;
  padding:14px 18px;font-weight:700;font-size:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.3)
}
#live{
  display:none;position:fixed;z-index:25;left:18px;bottom:31px;
  color:#fff;font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  text-shadow:0 2px 10px rgba(0,0,0,.7)
}
</style>
</head>
<body>
<div id="hint">Consenti la fotocamera e inquadra il marker Hiro.</div>
<div id="live">● REEKO AR ATTIVA</div>
<a id="cta" href="https://www.reeko.co/" target="_blank" rel="noopener">Scopri Reeko ↗</a>

<a-scene
  embedded
  vr-mode-ui="enabled:false"
  renderer="logarithmicDepthBuffer:true; antialias:true; alpha:true"
  arjs="sourceType:webcam; debugUIEnabled:false; trackingMethod:best;"
>
  <a-assets>
    <img id="reekoGraphic" src="./reeko-overlay.png" crossorigin="anonymous">
  </a-assets>

  <a-marker
    id="marker"
    preset="hiro"
    emitevents="true"
    smooth="true"
    smooth-count="10"
    smooth-tolerance="0.01"
    smooth-threshold="5"
  >
    <a-entity
      id="art"
      position="0 0.35 0"
      rotation="-90 0 0"
      scale="1.35 1.35 1.35"
      animation__float="property:position; dir:alternate; dur:1500; easing:easeInOutSine; loop:true; to:0 0.52 0"
      animation__pulse="property:scale; dir:alternate; dur:2200; easing:easeInOutSine; loop:true; to:1.52 1.52 1.52"
    >
      <a-plane
        width="1.15"
        height="1.15"
        material="src:#reekoGraphic; transparent:true; alphaTest:0.05; side:double"
      ></a-plane>
    </a-entity>

    <a-ring
      position="0 0.03 0"
      rotation="-90 0 0"
      radius-inner="0.54"
      radius-outer="0.57"
      material="color:#ffffff; opacity:.55; transparent:true"
      animation="property:rotation; to:-90 0 360; dur:9000; loop:true; easing:linear"
    ></a-ring>
  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
const marker = document.getElementById('marker');
const cta = document.getElementById('cta');
const live = document.getElementById('live');
const hint = document.getElementById('hint');

marker.addEventListener('markerFound', () => {
  cta.style.display = 'block';
  live.style.display = 'block';
  hint.textContent = 'Marker riconosciuto — muovi leggermente il telefono.';
});
marker.addEventListener('markerLost', () => {
  cta.style.display = 'none';
  live.style.display = 'none';
  hint.textContent = 'Inquadra di nuovo il marker.';
});
</script>
</body>
</html>
