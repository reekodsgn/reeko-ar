<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Reeko AR GIF Test</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gifuct-js@2.1.2/dist/gifuct-js.min.js"></script>

  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Inter,system-ui,-apple-system,sans-serif}
    a-scene{position:fixed!important;inset:0!important}
    #ui{position:fixed;inset:0;z-index:9999;pointer-events:none}
    #status{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.65);color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;white-space:nowrap}
    #cta{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#fff;color:#111;padding:14px 18px;border-radius:999px;text-decoration:none;font-weight:700;display:none;pointer-events:auto}
    #error{position:absolute;left:18px;right:18px;bottom:90px;background:#fff;color:#111;padding:12px;border-radius:12px;font-size:12px;display:none;pointer-events:auto}
  </style>
</head>
<body>

<div id="ui">
  <div id="status">Avvio fotocamera…</div>
  <a id="cta" href="https://www.reeko.co/" target="_blank" rel="noopener">Scopri Reeko ↗</a>
  <div id="error"></div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; uiError: yes;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights: true, antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <canvas id="gifCanvas"></canvas>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
    <a-plane
      id="gifPlane"
      material="src: #gifCanvas; transparent: true; shader: flat; side: double"
      position="0 0 0.02"
      width="0.65"
      height="0.65"
      rotation="0 0 0">
    </a-plane>
  </a-entity>
</a-scene>

<script>
(function(){
  const status = document.getElementById('status');
  const cta = document.getElementById('cta');
  const err = document.getElementById('error');
  const target = document.getElementById('targetEntity');
  const canvas = document.getElementById('gifCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });

  function showError(msg){
    err.style.display='block';
    err.textContent=msg;
    status.textContent='Errore';
  }

  window.addEventListener('error', e => showError('JS: ' + (e.message || 'errore sconosciuto')));
  window.addEventListener('unhandledrejection', e => showError('Promise: ' + (e.reason?.message || e.reason || 'errore sconosciuto')));

  target.addEventListener('targetFound', () => {
    status.textContent='Target riconosciuto';
    cta.style.display='block';
  });

  target.addEventListener('targetLost', () => {
    status.textContent='Inquadra il target';
    cta.style.display='none';
  });

  async function initGif(){
    try{
      const response = await fetch('./overlay.gif', {cache:'no-store'});
      if(!response.ok) throw new Error('overlay.gif non trovato ('+response.status+')');
      const buffer = await response.arrayBuffer();

      const gif = gifuctjs.parseGIF(buffer);
      const frames = gifuctjs.decompressFrames(gif, true);

      if(!frames.length) throw new Error('GIF senza frame');

      const w = gif.lsd.width, h = gif.lsd.height;
      canvas.width = w; canvas.height = h;

      let i = 0;
      let prev = null;
      const backup = document.createElement('canvas');
      backup.width = w; backup.height = h;
      const bctx = backup.getContext('2d');

      function renderFrame(){
        const f = frames[i];

        if(prev){
          if(prev.disposalType === 2){
            const d = prev.dims;
            ctx.clearRect(d.left,d.top,d.width,d.height);
          } else if(prev.disposalType === 3){
            ctx.clearRect(0,0,w,h);
            ctx.drawImage(backup,0,0);
          }
        }

        if(f.disposalType === 3){
          bctx.clearRect(0,0,w,h);
          bctx.drawImage(canvas,0,0);
        }

        const imageData = new ImageData(
          new Uint8ClampedArray(f.patch),
          f.dims.width,
          f.dims.height
        );
        ctx.putImageData(imageData, f.dims.left, f.dims.top);

        const plane = document.getElementById('gifPlane');
        const mesh = plane && plane.getObject3D('mesh');
        if(mesh && mesh.material && mesh.material.map){
          mesh.material.map.needsUpdate = true;
        }

        prev = f;
        i = (i + 1) % frames.length;
        const delay = Math.max(30, (f.delay || 10) * 10);
        setTimeout(renderFrame, delay);
      }

      renderFrame();
      status.textContent='Inquadra il target';
    }catch(e){
      showError('GIF: ' + e.message);
    }
  }

  document.querySelector('a-scene').addEventListener('loaded', initGif);
})();
</script>

</body>
</html>
