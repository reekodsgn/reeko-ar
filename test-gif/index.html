<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Reeko AR — Camera Live</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:transparent !important;
      font-family:Inter,system-ui,-apple-system,sans-serif;
    }

    /* Il video della fotocamera resta visibile dietro al canvas AR */
    video{
      position:fixed !important;
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      object-fit:cover !important;
      z-index:0 !important;
    }

    a-scene{
      position:fixed !important;
      inset:0 !important;
      z-index:1 !important;
      background:transparent !important;
    }

    canvas.a-canvas{
      background:transparent !important;
    }

    #ui{
      position:fixed;
      inset:0;
      z-index:9999;
      pointer-events:none;
    }

    #status{
      position:absolute;
      top:18px;
      left:50%;
      transform:translateX(-50%);
      background:rgba(0,0,0,.55);
      color:#fff;
      padding:10px 14px;
      border-radius:999px;
      font-size:13px;
      white-space:nowrap;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    #cta{
      position:absolute;
      left:50%;
      bottom:28px;
      transform:translateX(-50%);
      background:#fff;
      color:#111;
      padding:14px 18px;
      border-radius:999px;
      text-decoration:none;
      font-weight:700;
      display:none;
      pointer-events:auto;
      box-shadow:0 8px 30px rgba(0,0,0,.18);
    }

    #error{
      position:absolute;
      left:18px;
      right:18px;
      bottom:95px;
      background:#fff;
      color:#111;
      padding:12px;
      border-radius:12px;
      font-size:12px;
      display:none;
      pointer-events:auto;
    }
  </style>
</head>
<body>

<div id="ui">
  <div id="status">Avvio fotocamera…</div>
  <a id="cta" href="https://www.reeko.co/" target="_blank" rel="noopener">Scopri Reeko ↗</a>
  <div id="error"></div>
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; uiError: yes;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true; alpha: true;"
  background="transparent: true; color: #000000"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <canvas id="gifCanvas"></canvas>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="targetEntity" mindar-image-target="targetIndex: 0">
    <a-plane
      id="gifPlane"
      material="src: #gifCanvas; transparent: true; shader: flat; side: double; alphaTest: 0.01"
      position="0 0 0.02"
      width="0.8"
      height="0.8">
    </a-plane>
  </a-entity>
</a-scene>

<script type="module">
import { parseGIF, decompressFrames } from 'https://esm.sh/gifuct-js@2.1.2';

const status = document.getElementById('status');
const cta = document.getElementById('cta');
const err = document.getElementById('error');
const target = document.getElementById('targetEntity');
const canvas = document.getElementById('gifCanvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });

function showError(msg){
  err.style.display='block';
  err.textContent=msg;
  status.textContent='Errore';
}

window.addEventListener('error', e => showError('JS: ' + (e.message || 'errore sconosciuto')));
window.addEventListener('unhandledrejection', e => showError('Promise: ' + (e.reason?.message || e.reason || 'errore sconosciuto')));

target.addEventListener('targetFound', () => {
  status.textContent='Target riconosciuto';
  cta.style.display='block';
});

target.addEventListener('targetLost', () => {
  status.textContent='Inquadra il target';
  cta.style.display='none';
});

async function initGif(){
  try{
    const response = await fetch('./overlay.gif', {cache:'no-store'});
    if(!response.ok) throw new Error('overlay.gif non trovato ('+response.status+')');

    const buffer = await response.arrayBuffer();
    const gif = parseGIF(buffer);
    const frames = decompressFrames(gif, true);
    if(!frames.length) throw new Error('GIF senza frame');

    const w = gif.lsd.width;
    const h = gif.lsd.height;
    canvas.width = w;
    canvas.height = h;

    const plane = document.getElementById('gifPlane');
    const maxSize = 0.9;

    if (w >= h) {
      plane.setAttribute('width', maxSize);
      plane.setAttribute('height', maxSize * (h / w));
    } else {
      plane.setAttribute('height', maxSize);
      plane.setAttribute('width', maxSize * (w / h));
    }

    let frameIndex = 0;
    let previousFrame = null;
    let restoreImage = null;

    function drawNext(){
      const frame = frames[frameIndex];
      const d = frame.dims;

      if (previousFrame) {
        if (previousFrame.disposalType === 2) {
          const pd = previousFrame.dims;
          ctx.clearRect(pd.left, pd.top, pd.width, pd.height);
        } else if (previousFrame.disposalType === 3 && restoreImage) {
          ctx.putImageData(restoreImage, 0, 0);
        }
      }

      if (frame.disposalType === 3) {
        restoreImage = ctx.getImageData(0, 0, w, h);
      }

      const imageData = new ImageData(
        new Uint8ClampedArray(frame.patch),
        d.width,
        d.height
      );
      ctx.putImageData(imageData, d.left, d.top);

      const mesh = plane.getObject3D('mesh');
      if (mesh?.material?.map) mesh.material.map.needsUpdate = true;

      previousFrame = frame;
      frameIndex = (frameIndex + 1) % frames.length;
      setTimeout(drawNext, Math.max(20, frame.delay || 100));
    }

    drawNext();
    status.textContent='Inquadra il target';
  } catch(e) {
    showError('GIF: ' + e.message);
  }
}

const scene = document.querySelector('a-scene');

scene.addEventListener('renderstart', () => {
  const renderer = scene.renderer;
  if (renderer) {
    renderer.setClearColor(0x000000, 0);
    renderer.setClearAlpha(0);
  }
});

if (scene.hasLoaded) initGif();
else scene.addEventListener('loaded', initGif, {once:true});
</script>

</body>
</html>
